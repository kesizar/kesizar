    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="scanlines" width="900" height="2" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="transparent"/>
      <rect y="1" width="900" height="1" fill="rgba(0,0,0,0.25)"/>
    </pattern>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccffdd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ccffdd" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ccffdd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="16" y="16" width="868" height="768" rx="12"/>
    </clipPath>
    <style type="text/css"><![CDATA[

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typein {
      to { opacity: 1; }
    }
    @keyframes scanmove {
      from { transform: translateY(-60px); }
      to { transform: translateY(800px); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.96; }
    }
    .line {
      opacity: 0;
      animation: typein 0.05s steps(1) forwards;
    }
    .flicker {
      animation: flicker 0.15s steps(2) infinite;
    }
    .phosphor {
      filter: drop-shadow(0 0 4px rgba(51, 255, 102, 0.6));
    }
    .scanband {
      animation: scanmove 6s linear infinite;
      transform-box: fill-box;
      transform-origin: 0 0;
    }
    .cursor {
      opacity: 0;
      animation: blink 1s steps(1) infinite;
      animation-delay: 2.85s;
    }

    ]]></style>
  </defs>

