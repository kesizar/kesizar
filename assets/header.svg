<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-label="HAOYAN ZHANG">
  <title>HAOYAN ZHANG — isometric CRT · Nankai University · College of Software</title>
  <defs>
    <radialGradient id="scrBg" cx="48%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#102410"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </radialGradient>
    <pattern id="hdrScan" width="4" height="2" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="transparent"/>
      <rect y="1" width="4" height="1" fill="rgba(0,0,0,0.25)"/>
    </pattern>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="scrClip">
      <rect x="14" y="10" width="212" height="78" rx="3"/>
    </clipPath>
    <style type="text/css"><![CDATA[
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes glowbreath {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.96; }
    }
    .phosphor {
      filter: drop-shadow(0 0 4px rgba(51, 255, 102, 0.6));
    }
    .header-flicker {
      animation: flicker 0.15s steps(2) infinite;
    }
    .header-cursor {
      animation: blink 1s steps(1) infinite;
    }
    .glow {
      animation: glowbreath 4s ease-in-out infinite;
    }
    ]]></style>
  </defs>

