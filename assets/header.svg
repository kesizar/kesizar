  <defs>
    <radialGradient id="hdrBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </radialGradient>
    <radialGradient id="hdrVignette" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="hdrScan" width="900" height="2" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="transparent"/>
      <rect y="1" width="900" height="1" fill="rgba(0,0,0,0.25)"/>
    </pattern>
    <linearGradient id="hdrBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccffdd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ccffdd" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ccffdd" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hdrClip">
      <rect x="10" y="8" width="880" height="124" rx="14"/>
    </clipPath>
    <style type="text/css"><![CDATA[

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanmove {
      from { transform: translateY(-60px); }
      to { transform: translateY(140px); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.96; }
    }
    .phosphor {
      filter: drop-shadow(0 0 4px rgba(51, 255, 102, 0.6));
    }
    .scanband {
      animation: scanmove 6s linear infinite;
      transform-box: fill-box;
      transform-origin: 0 0;
    }
    .header-flicker {
      animation: flicker 0.15s steps(2) infinite;
    }
    .header-cursor {
      animation: blink 1s steps(1) infinite;
    }

    ]]></style>
  </defs>

