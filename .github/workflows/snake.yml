# 生成 GitHub 贡献贪吃蛇动画，并推送到 output 分支。
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00 运行一次
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: kesizar
          outputs: |
            dist/snake.svg

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
